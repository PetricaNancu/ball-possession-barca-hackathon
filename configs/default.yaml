# Default configuration. Override any key with `--config path/to/other.yaml`.

team: our_team            # names the submission file: evaluation/results/<team>.csv
game: BAR-ATH

pipeline:
  method: engine          # engine | baseline

baseline:
  window: 50              # half-width of the majority vote, in frames (25 fps)

engine:
  n_rounds: 300           # LightGBM boosting rounds
  train_stride: 2         # keep every k-th graded frame for training (frames are highly correlated)

corpus:
  # DFL BallPossession flips on single touches; spells shorter than this, sandwiched between the
  # same opponent, are relabelled to that opponent (docs/02-label-harmonisation.md). Chosen by
  # matching Metrica's possession-duration distribution: KS-optimal 62, count-optimal 50.
  sportec_sandwich_max_frames: 50
