[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mtah-possession"
version = "0.1.0"
description = "Frame-level ball possession for More than a Hack 2027 (BAR-ATH)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy==2.5.4",
    "pandas==3.0.6",
    "PyYAML==6.0.3",
    "kloppy==3.19.1",
    "lightgbm==4.7.0",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[tool.setuptools]
packages = ["mtah"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
